# Label definitions for distributed-lock-lab.
#
# Applied by .github/workflows/labels.yml on push to master, or by hand:
#   gh label create "type:task" --color "1d76db" --description "..." --force
#
# Keep this file as the single source of truth. A label created ad hoc in the web
# UI will be deleted on the next sync.

# --- Type: what kind of work is this -----------------------------------------
- name: "type:task"
  color: "1d76db"
  description: "Implementation of a specification from tasks/"
- name: "type:bug"
  color: "d73a4a"
  description: "Behaviour differs from what the specifications say"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation: wrong, missing, unclear, or out of date"
- name: "type:contract"
  color: "b60205"
  description: "Amends an authoritative contract (C1-C5). Breaking by definition"
- name: "type:adr"
  color: "5319e7"
  description: "Proposes, supersedes, or amends a decision record"
- name: "type:chore"
  color: "fef2c0"
  description: "Build, CI, tooling, dependencies"

# --- Status: where it is in the pipeline -------------------------------------
- name: "status:needs-triage"
  color: "ededed"
  description: "Not yet assessed by a maintainer"
- name: "status:ready"
  color: "0e8a16"
  description: "Preconditions are merged. Safe to start now"
- name: "status:blocked"
  color: "e99695"
  description: "Waiting on an unmerged precondition or an unresolved decision"
- name: "status:claimed"
  color: "c2e0c6"
  description: "Someone is working on this. Claims lapse after 14 days of silence"
- name: "status:in-review"
  color: "bfd4f2"
  description: "A pull request is open and awaiting review"
- name: "status:split"
  color: "d4c5f9"
  description: "Scope was larger than specified; remainder moved to a reserved id"

# --- Entry points -------------------------------------------------------------
- name: "good first issue"
  color: "7057ff"
  description: "Completable without holding the whole architecture in your head"
- name: "help wanted"
  color: "008672"
  description: "Unclaimed and ready. Maintainers are not working on this"
- name: "needs:two-approvals"
  color: "b60205"
  description: "Contract, ADR, or lock-api change. Two maintainers must approve"
- name: "needs:cloud"
  color: "fbca04"
  description: "Requires a Google Cloud project. THIS COSTS REAL MONEY"

# --- Area: which part of the system ------------------------------------------
- name: "area:lock-api"
  color: "c5def5"
  description: "The dependency-free contract module. Wire-compatibility surface"
- name: "area:lock-server"
  color: "c5def5"
  description: "Lease authority, token minting, the HTTP surface"
- name: "area:lock-client"
  color: "c5def5"
  description: "The SDK: conservative deadline, heartbeat, checkStillHeld"
- name: "area:store-pg"
  color: "c5def5"
  description: "The PostgreSQL lock backend"
- name: "area:store-etcd"
  color: "c5def5"
  description: "The etcd lock backend"
- name: "area:payments"
  color: "c5def5"
  description: "payment-resource, payout-executor, the ledger, fence point (a)"
- name: "area:rail"
  color: "c5def5"
  description: "rail-proxy and rail-stub. Fence point (c)"
- name: "area:harness"
  color: "c5def5"
  description: "Scenarios, chaos injection, invariant checkers, benchmarks"
- name: "area:infra"
  color: "c5def5"
  description: "Terraform, Kubernetes, GKE Autopilot"
- name: "area:observability"
  color: "c5def5"
  description: "Metrics, logs, traces, SLOs, alerts, runbooks"
- name: "area:build"
  color: "c5def5"
  description: "Gradle, version catalog, convention plugins, CI"

# --- Significance -------------------------------------------------------------
- name: "critical-path"
  color: "d93f0b"
  description: "On the M0 -> M1 -> M2 -> T-042 path to the central claim"
- name: "safety"
  color: "b60205"
  description: "Touches fencing, token monotonicity, or mutual exclusion. Review hardest"
- name: "breaking"
  color: "b60205"
  description: "Changes a pinned name or a wire contract"

# --- Resolution ---------------------------------------------------------------
- name: "wontfix"
  color: "ffffff"
  description: "Deliberately out of scope. See docs/00-charter.md non-goals"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already tracked elsewhere"
- name: "question"
  color: "d876e3"
  description: "Needs clarification before it can be actioned"
