# Gradle build, test and style check.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repository is specification-first: until T-001 lands there is no Gradle
  # build to run. This gate lets CI be green and meaningful today, and start doing
  # real work the moment M0 merges, without anyone having to remember to enable it.
  detect:
    name: gradle gate
    runs-on: ubuntu-latest
    outputs:
      has-build: ${{ steps.check.outputs.has-build }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "has-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No settings.gradle.kts yet — T-001 has not landed. Skipping the Gradle build."
          fi

  build:
    name: gradle build
    needs: detect
    if: needs.detect.outputs.has-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Style check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Build and test
        run: ./gradlew build --no-daemon

      # lock-api carries the wire contract for six modules. If it ever acquires a
      # third-party dependency, every consumer inherits that version choice and the
      # contract becomes entangled with a framework's lifecycle (C2 #ct2-zero-dep).
      - name: Verify lock-api has zero third-party dependencies
        run: |
          ./gradlew :lock-api:dependencies --configuration runtimeClasspath --no-daemon \
            | tee /tmp/deps.txt
          if grep -qE '^[\\+|].*---' /tmp/deps.txt; then
            echo "::error file=lock-api/build.gradle.kts::lock-api must have zero third-party dependencies (C2 #ct2-zero-dep)"
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
