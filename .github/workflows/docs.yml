# Documentation checks.
#
# Documentation is a first-class deliverable in this repository: the design is
# written before the code, so a broken cross-reference is a real defect. These
# checks run today, on a repository that has no code yet.
#
# The logic lives in scripts/check-docs.sh so that contributors can run exactly
# what CI runs, locally, before opening a pull request:
#
#     ./scripts/check-docs.sh
name: docs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Relative links resolve
        run: ./scripts/check-docs.sh links

      - name: Repository hygiene
        run: ./scripts/check-docs.sh hygiene

      - name: Task board matches tasks/
        run: ./scripts/check-docs.sh ledger

      - name: Review routing matches the maintainer roster
        run: ./scripts/check-docs.sh codeowners
