# CodeQL static analysis.
#
# Guarded the same way as the build workflow: there is no Java to analyse until
# T-001 lands, and a hard-failing scan on an empty repository trains people to
# ignore red CI.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has-java: ${{ steps.check.outputs.has-java }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if find . -name '*.java' -not -path './.git/*' | grep -q .; then
            echo "has-java=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-java=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Java sources yet. Skipping CodeQL."
          fi

  analyze:
    needs: detect
    if: needs.detect.outputs.has-java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
