# CodeQL static analysis.
#
# Built with the Gradle wrapper, not autobuild: on a convention-plugin monorepo
# autobuild guesses which projects to compile, and a scan that extracted a subset
# of the code reports as clean. A falsely clean scan is worse than none.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          queries: security-extended
          build-mode: manual

      # No Gradle cache in this job, on purpose: restored outputs make compile
      # tasks UP-TO-DATE, CodeQL then sees no compiler run and extracts nothing.
      # --no-daemon keeps javac and kotlinc inside the traced process tree.
      - name: Build with the Gradle wrapper
        run: ./gradlew --no-daemon --no-build-cache testClasses

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:java-kotlin"
