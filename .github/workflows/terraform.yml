# Terraform formatting and validation.
#
# Authoring and validating HCL costs nothing and needs no cloud credentials --
# which is why the whole M5 infrastructure lane can proceed in parallel with the
# Java milestones. Nothing here ever runs `terraform apply`.
name: terraform

on:
  push:
    branches: [master]
    paths: ['deploy/terraform/**']
  pull_request:
    paths: ['deploy/terraform/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.0'

      - name: Format check
        run: terraform fmt -check -recursive deploy/terraform

      - name: Validate each module
        run: |
          set -e
          find deploy/terraform -name '*.tf' -exec dirname {} \; | sort -u | while read -r d; do
            echo "==> $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
