# Terraform formatting, validation and lint.
#
# Authoring and validating HCL costs nothing and needs no cloud credentials --
# which is why the whole M5 infrastructure lane can proceed in parallel with the
# Java milestones. Nothing here ever runs `terraform apply`.
#
# `init -backend=false` is the whole reason this works offline: a plain `init`
# reaches for the gs://dlock-tfstate backend and fails with a credentials error
# that looks like a workflow bug (ADR-008).
name: infra

on:
  push:
    branches: [master]
    paths:
      - 'deploy/terraform/**'
      - '.github/workflows/infra.yml'
      # The Terraform and tflint versions come from here (see the versions step).
      - 'gradle/libs.versions.toml'
      - 'scripts/check-versions.sh'
  pull_request:
    paths:
      - 'deploy/terraform/**'
      - '.github/workflows/infra.yml'
      # The Terraform and tflint versions come from here (see the versions step).
      - 'gradle/libs.versions.toml'
      - 'scripts/check-versions.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The versions live in gradle/libs.versions.toml, the only place a version
      # may live (C5 #ct5-catalog). Assigned first, so a missing row fails the
      # step under bash -e instead of passing an empty version on.
      - name: Tool versions from the version catalog
        id: versions
        run: |
          terraform="$(./scripts/check-versions.sh --get terraform)"
          tflint="$(./scripts/check-versions.sh --get tflint)"
          echo "terraform=$terraform" >> "$GITHUB_OUTPUT"
          echo "tflint=v$tflint" >> "$GITHUB_OUTPUT"

      # 1.15 is the line C5 and ADR-008 pin; the catalog row holds the patch.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      # Formatting first: the cheapest failure, and it needs no init.
      - name: Format check
        run: terraform fmt -check -recursive deploy/terraform

      # Every directory holding a .tf file, because ADR-008 puts them in
      # envs/<env>/ and modules/<noun>/ and none in deploy/terraform itself. Until
      # T-050 adds the first one, deploy/terraform is validated as it stands, so
      # init and validate run today rather than being skipped.
      - name: Validate each module
        run: |
          set -euo pipefail
          dirs="$(find deploy/terraform -name '*.tf' -exec dirname {} \; | sort -u)"
          dirs="${dirs:-deploy/terraform}"
          while read -r d; do
            echo "==> $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done <<<"$dirs"

      # Pinned for the same reason as Terraform, from the catalog's tflint row.
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ steps.versions.outputs.tflint }}

      - name: Lint
        run: tflint --chdir=deploy/terraform --recursive
