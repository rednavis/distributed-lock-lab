# Sync GitHub labels from .github/labels.yml.
#
# labels.yml is the single source of truth. A label created ad hoc in the web UI
# is deleted on the next sync -- that is deliberate, so the label set stays
# meaningful instead of accreting near-duplicates.
name: labels

on:
  push:
    branches: [master]
    paths: ['.github/labels.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
