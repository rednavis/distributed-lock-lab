# Dependency update automation.
#
# Only ecosystems that actually exist in the tree are enabled. A Dependabot job
# pointed at a directory that does not exist fails every run, and a permanently
# red job trains people to ignore red -- which is the opposite of what the
# automation is for.
#
# The commented-out blocks below are correct and ready; uncomment each one in
# the pull request that creates the directory it watches.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:build"]
    commit-message:
      prefix: "chore(ci)"

  # Enable in T-002, which creates gradle/libs.versions.toml.
  #
  # The version catalog is the single place any version appears, by contract
  # (C5 #ct5-catalog), so Dependabot produces one coherent PR per group rather
  # than scattering coordinates across build files.
  #
  # - package-ecosystem: "gradle"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #   open-pull-requests-limit: 5
  #   labels: ["type:chore", "area:build"]
  #   commit-message:
  #     prefix: "chore(deps)"
  #   groups:
  #     # Spring Boot's BOM governs a large coordinated surface; splitting its
  #     # members across PRs produces combinations nobody tests.
  #     spring:
  #       patterns: ["org.springframework*"]
  #     testing:
  #       patterns: ["org.junit*", "org.assertj*", "org.testcontainers*", "org.awaitility*"]
  #     observability:
  #       patterns: ["io.micrometer*", "io.opentelemetry*"]

  # Enable in T-050, which creates deploy/terraform/.
